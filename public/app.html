<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgerlight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">

<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<div class="shell" id="shell">
  <aside class="rail" id="rail" aria-label="Tools"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view" tabindex="-1">
      <div class="empty"><div class="em-ico"></div><h3>Loading your ledger…</h3></div>
    </main>
  </div>
</div>
<button class="fab" id="fab" aria-label="Add a transaction"></button>
<input type="file" id="filepick" hidden>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>

<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
<script src="js/views-overview.js"></script>
<script src="js/views-money.js"></script>

<script src="js/views-insight.js"></script>
<script src="js/views-tools.js"></script>

</html>
